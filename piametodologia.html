<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacitrack - FACPYA</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root { --primary:#003366; --bg:#f4f7f6; --white:#fff; --success:#2ecc71; --danger:#e74c3c; }

body {
    font-family:'Segoe UI', sans-serif;
    background:#1a1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.phone {
    width:375px;
    height:667px;
    background:var(--bg);
    border-radius:40px;
    padding:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    overflow:hidden;
    position:relative;
}

.screen { display:none; flex-direction:column; height:100%; }
.active { display:flex; }

.logo-area { text-align:center; margin-bottom:20px; }
.logo-area i { font-size:40px; color:var(--primary); }
.logo-area h1 { margin:0; color:var(--primary); }

input, select {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing: border-box;
}

button {
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-main { background:var(--primary); color:white; }

.card {
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.alert {
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 15px;
    border-radius:20px;
    color:white;
    display:none;
}
</style>
</head>

<body>

<div class="phone">

<div id="alert" class="alert"></div>

<!-- LOGIN -->
<div id="login" class="screen active" style="justify-content:center;">
<div class="logo-area">
<i class="fas fa-boxes-stacked"></i>
<h1>Capacitrack</h1>
<p>Inicio de sesión</p>
</div>

<input id="email" placeholder=" Correo">
<input id="pass" type="password" placeholder=" Contraseña">

<button class="btn-main" id="btnLogin"> Entrar</button>
</div>

<!-- DASH -->
<div id="dash" class="screen">
<h2>📊 Dashboard</h2>

<div style="display:flex; justify-content:space-between;">
<p>Hola <b id="user-name"></b> 👋</p>
<button onclick="logout()">🚪</button>
</div>

<div id="main-ui"></div>
<div id="extra-panel"></div>

</div>

<!-- NUEVO -->
<div id="new" class="screen">
<h3>🆕 Nuevo pedido</h3>

<select id="select"></select>
<input id="cant" type="number" placeholder="Cantidad">

<button onclick="addCarrito()">➕ Agregar</button>

<div id="carrito"></div>

<button class="btn-main" onclick="confirmar()">✅ Confirmar</button>
<button onclick="show('dash')">⬅️ Volver</button>
</div>

</div>

<script>

/* ===== USERS ===== */
const users = [
{email:"purofacpya@test.com", pass:"1234", rol:"empleado", nombre:"Empleado"},
{email:"supervisor@test.com", pass:"1234", rol:"supervisor", nombre:"Supervisor"},
{email:"admin@test.com", pass:"1234", rol:"admin", nombre:"Admin"}
];

let currentUser=null;

/* ===== STORAGE ===== */
function save(){ localStorage.setItem("appState", JSON.stringify(appState)); }
function load(){
    const d = localStorage.getItem("appState");
    if(d) appState = JSON.parse(d);
}

/* ===== STATE ===== */
let appState = {
    limite:5,
    pedidos:[],
    productos:[
        {nombre:"Tortas", stock:10, precio:50},
        {nombre:"Refrescos", stock:5, precio:20},
        {nombre:"Papas", stock:2, precio:30},
        {nombre:"Galletas", stock:0, precio:10}
    ]
};

let carrito=[];
load();

/* ===== UI ===== */
function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function notify(msg, color="#e74c3c"){
    const a=document.getElementById('alert');
    a.innerText=msg;
    a.style.background=color;
    a.style.display="block";
    setTimeout(()=>a.style.display="none",2000);
}

/* ===== LOGIN ===== */
btnLogin.onclick=()=>{
    const u=email.value.trim().toLowerCase();
    const p=pass.value.trim();

    const user=users.find(x=>x.email===u && x.pass===p);

    if(user){
        currentUser=user;
        document.getElementById('user-name').innerText=user.nombre;
        show("dash");
        renderUI();
    } else notify("Datos incorrectos");
};

function logout(){
    currentUser=null;
    show("login");
}

/* ===== RENDER ===== */
function renderUI(){

    const main=document.getElementById('main-ui');
    const extra=document.getElementById('extra-panel');

    main.innerHTML="";
    extra.innerHTML="";

    /* ===== EMPLEADO ===== */
    if(currentUser.rol==="empleado"){

        main.innerHTML=`
        <div class="card">
        📦 Pedidos hoy: <b>${appState.pedidos.length}</b><br>
        🔥 Top producto: <b>${getTopProducto()}</b>
        </div>

        <div class="card">
        📊 Pedidos activos: <b>${appState.pedidos.length}/${appState.limite}</b>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn-main" onclick="irNuevo()">➕ Pedido</button>
            <button onclick="verPedidos()">📋</button>
            <button onclick="verProductos()">📦</button>
        </div>
        `;
    }

    /* ===== SUPERVISOR ===== */
    if(currentUser.rol==="supervisor"){

        let total=0;
        let conteo={};

        appState.pedidos.forEach(p=>{
            p.items.forEach(i=>{
                const prod=appState.productos.find(x=>x.nombre===i.nombre);
                total += i.cantidad * prod.precio;

                conteo[i.nombre]=(conteo[i.nombre]||0)+i.cantidad;
            });
        });

        let top="N/A", max=0;
        for(let k in conteo){
            if(conteo[k]>max){ max=conteo[k]; top=k; }
        }

        main.innerHTML=`
        <div class="card">💰 Total generado: <b>$${total}</b></div>
        <div class="card">🔥 Top producto: <b>${top}</b></div>
        `;
    }

    /* ===== ADMIN ===== */
    if(currentUser.rol==="admin"){

        main.innerHTML=`
        <div class="card">
        <b>➕ Crear producto</b><br><br>
        <input id="nuevoProd" placeholder="Nombre">
        <input id="nuevoStock" type="number" placeholder="Stock">
        <input id="nuevoPrecio" type="number" placeholder="Precio">
        <button class="btn-main" onclick="crearProducto()">Crear</button>
        </div>

        <div class="card">
        <b>✏️ Editar precio</b><br><br>
        <select id="editSelect"></select>
        <input id="editPrecio" type="number" placeholder="Nuevo precio">
        <button class="btn-main" onclick="editarPrecio()">Guardar</button>
        </div>
        `;

        cargarSelectAdmin();
    }
}

/* ===== FUNCIONES ===== */
function getTopProducto(){
    let conteo={};
    appState.pedidos.forEach(p=>{
        p.items.forEach(i=>{
            conteo[i.nombre]=(conteo[i.nombre]||0)+i.cantidad;
        });
    });

    let top="N/A", max=0;
    for(let k in conteo){
        if(conteo[k]>max){ max=conteo[k]; top=k; }
    }
    return top;
}

function verProductos(){
    let html="";
    appState.productos.forEach(p=>{
        html+=`
        <div class="card">
        ${p.nombre}<br>
        Stock: ${p.stock}<br>
        Precio: $${p.precio}
        </div>`;
    });
    document.getElementById('extra-panel').innerHTML=html;
}

function verPedidos(){
    let html="";
    appState.pedidos.forEach((p,i)=>{
        html+=`
        <div class="card">
        Pedido #${i+1}<br>
        ${p.items.map(x=>x.nombre).join(", ")}
        </div>`;
    });
    document.getElementById('extra-panel').innerHTML=html;
}

/* ===== PEDIDOS ===== */
function irNuevo(){
    carrito=[];
    select.innerHTML="";
    appState.productos.forEach((p,i)=>{
        select.innerHTML+=<option value="${i}">${p.nombre} (${p.stock})</option>;
    });
    show("new");
}

function addCarrito(){
    const idx=select.value;
    const c=parseInt(cant.value);
    const p=appState.productos[idx];

    if(!c || c<=0) return notify("Cantidad inválida");
    if(c>p.stock) return notify("Sin stock");

    carrito.push({nombre:p.nombre, cantidad:c});
    renderCarrito();
}

function renderCarrito(){
    const c=document.getElementById('carrito');
    c.innerHTML="";
    carrito.forEach(i=>{
        c.innerHTML+=<div class="card">${i.nombre} x${i.cantidad}</div>;
    });
}

function confirmar(){
    if(carrito.length===0) return notify("Vacío");

    carrito.forEach(i=>{
        const p=appState.productos.find(x=>x.nombre===i.nombre);
        p.stock-=i.cantidad;
    });

    appState.pedidos.push({items:[...carrito]});

    save();

    notify("Pedido creado","#2ecc71");
    show("dash");
    renderUI();
}

/* ===== ADMIN ===== */
function crearProducto(){
    appState.productos.push({
        nombre:nuevoProd.value,
        stock:parseInt(nuevoStock.value),
        precio:parseInt(nuevoPrecio.value)
    });
    save();
    renderUI();
}

function cargarSelectAdmin(){
    const sel=document.getElementById('editSelect');
    sel.innerHTML="";
    appState.productos.forEach((p,i)=>{
        sel.innerHTML+=<option value="${i}">${p.nombre}</option>;
    });
}

function editarPrecio(){
    const idx=document.getElementById('editSelect').value;
    const nuevo=parseInt(document.getElementById('editPrecio').value);

    if(!nuevo) return notify("Precio inválido");

    appState.productos[idx].precio=nuevo;
    save();
    renderUI();
}

</script>

</body>
</html>
